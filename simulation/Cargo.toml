[package]
name = "simulation"
version = "0.1.0"
edition = "2024"
authors = [ "Mats de Beer matsdebeerk@gmail.com" ]
description = "wasm implementation of ft_transcendence game-submodule; People In Tyres"
license = "GPL/3"

[lib]
crate-type = [ "cdylib", "rlib" ]
path = "rs/lib.rs"

[dependencies]
include_f64_matrix = { version = "0.1.0", path = "include_f64_matrix" }
serde = { version = "1.0.229", features = ["derive"] }
serde_arrays = "0.2.0"
serde_json = "1.0.151"
wasm-bindgen = "0.2"
