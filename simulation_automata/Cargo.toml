[package]
name = "simulation_automata"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
colored = "3.1.1"
cuid = "2.0.4"
native-tls = "0.2.18"
rand = { version = "0.10.3", features = [ "chacha" ] }
simulation = { version = "0.1.0", path = "../simulation" }
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono" ] }
tokio = { version = "1.53.1", features = [ "rt", "macros" ] }
watch = "0.2.3"
