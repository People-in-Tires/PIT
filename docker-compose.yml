services:
  # builders, theyre just here for cacheing purposes. they do nothing beyond
  # that, and purposefully fail to run
  matrix_builder:
    build:
      dockerfile: shared.dockerfile
      target: matrix_builder
    deploy:
      replicas: 0
  simulation_src:
    build:
      dockerfile: shared.dockerfile
      target: simulation_src
    deploy:
      replicas: 0

  proxy:
    image: nginx:alpine
    ports:
      - "3001:80"
      - "3000:443"
    volumes:
      - nginx:/etc/nginx/:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - pit
    healthcheck:
      test: [ "CMD-SHELL", "service", "nginx", "status", "||", "exit", "1" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  server:
    build:
      dockerfile: server.dockerfile
      additional_contexts:
        simulation_src: service:simulation_src
        matrix_builder: service:matrix_builder
    container_name: server
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}@db:5432/${POSTGRES_DB}"
      UPLOAD_DIR: /pit/uploads
    env_file: .env
    volumes:
      - auth_secret:/secrets
      - assets:/pit/public:ro
      - uploads:/pit/uploads
    restart: unless-stopped
    networks:
      - pit
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget localhost:3000/api/health -O /dev/null" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  db:
    build:
      dockerfile: db.dockerfile
    container_name: db
    restart: unless-stopped
    ports:
      - 5432:5432
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - pit
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s

  sim:
    build:
      dockerfile: simulation.dockerfile
      additional_contexts:
        simulation_src: service:simulation_src
        matrix_builder: service:matrix_builder
    container_name: sim
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}@db:5432/${POSTGRES_DB}"
    networks:
      - pit
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy

networks:
  pit:

volumes:
  db:
    driver: local
    # driver_opts:
    #   type: none
    #   device: ./data/db
    #   o: bind
  assets:
    driver: local
    driver_opts:
      type: none
      device: ./pit/public
      o: bind
  nginx:
    driver: local
    driver_opts:
      type: none
      device: ./nginx
      o: bind
  auth_secret:
    driver: local
  uploads:
