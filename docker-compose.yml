services:
  server:
    build:
      dockerfile: server.dockerfile
    container_name: server
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}@db:5432/${POSTGRES_DB}"
    env_file: .env
    volumes:
      - auth_secret:/secrets
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - pit
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget localhost:3000/api/health -O /dev/null" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  db:
    build:
      dockerfile: db.dockerfile
    container_name: db
    restart: unless-stopped
    ports:
      - 5432:5432
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - pit
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s

  sim:
    build:
      dockerfile: simulation.dockerfile
    container_name: sim
    restart: no
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}@db:5432/${POSTGRES_DB}"
    networks:
      - pit
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy

networks:
  pit:

volumes:
  db:
    driver: local
    driver_opts:
      type: none
      device: ./data/db
      o: bind
  auth_secret:
    driver: local
