services:
  server:
    build:
      dockerfile: server.dockerfile
    container_name: server
    environment:
      DATABASE_URL: "postgres://postgres:admin@db:5432/prisma"
    env_file: .env
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - pit
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      dockerfile: db.dockerfile
    container_name: db
    restart: unless-stopped
    ports:
      - 5432:5432
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - pit
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s

networks:
  pit:

volumes:
  db:
    driver: local
    driver_opts:
      type: none
      device: ./data/db
      o: bind
