<!DOCTYPE html>
<html>
	<head>
		<title>New Profile Page</title>
	</head>
	<body>
		<h1>New Profile</h1>
		<section class="new-profile">
			<img id="avatar" src="avatar.png" alt="Avatar">
			<p>
				<strong>In game username: </strong>
				<input id="username"></input>
			</p>
			<p>
				<strong>Name: </strong>
				<input id="name"></input>
			</p>
			<p>
				<strong>Last name: </strong>
				<input id="last-name"></input>
			</p>
			<p>
				<strong>Age: </strong>
				<input id="age"></input>
			</p>
			<p>
				<strong>Country: </strong>
				<input id="country"></input>
			</p>
			<br>
			<p>
				<strong>Email address: </strong>
				<input id="email-address"></input>
			</p>
			<p>
				<strong>Password: </strong>
				<input id="new-password"></input>
			</p>
		</section>
		<button id="save-profile">Save profile</button>
	</body>
</html>
