<!DOCTYPE html>
<html>
	<head>
		<title>New Profile Page</title>
		<link rel="stylesheet" href="new_profile.css">
	</head>
	<body>
		<h1>New Profile</h1>
		<section class="new-profile">
			<img id="avatar" src="avatar.png" alt="Avatar">
			<p>
				<strong>In-game name: </strong>
				<input id="username">
			</p>
			<p>
				<strong>Name: </strong>
				<input id="name">
			</p>
			<p>
				<strong>Last name: </strong>
				<input id="last-name">
			</p>
			<p>
				<strong>Age: </strong>
				<input id="age">
			</p>
			<p>
				<strong>Country: </strong>
				<input id="country">
			</p>
			<br>
			<p>
				<strong>Email address: </strong>
				<input id="email-address">
			</p>
			<p>
				<strong>Password: </strong>
				<input id="new-password">
			</p>
		</section>
		<button id="save-profile">Save profile</button>
	</body>
</html>
