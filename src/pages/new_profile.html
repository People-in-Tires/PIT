<!doctype html>
<html>
  <head>
    <title>New Profile Page</title>
    <link rel="stylesheet" href="new_profile.css" />
  </head>
  <body>
    <h1>Create New Profile</h1>
    <form class="new-profile">
      <img id="avatar" src="avatar.png" alt="Avatar" />
      <p>
        <strong>User name: </strong>
        <input id="username" type="text" />
      </p>
      <p>
        <strong>First name: </strong>
        <input id="first-name" type="text" />
      </p>
      <p>
        <strong>Last name: </strong>
        <input id="last-name" type="text" />
      </p>
      <p>
        <strong>Age: </strong>
        <input id="age" type="number" />
      </p>
      <p>
        <strong>Country: </strong>
        <input id="country" type="text" />
      </p>
      <br />
      <p>
        <strong>Email address: </strong>
        <input id="email-address" type="email" />
      </p>
      <p>
        <strong>Password: </strong>
        <input id="new-password" type="password" />
      </p>
    </form>
    <button id="save-profile">🏁 Join the Pit Crew</button>
  </body>
</html>
